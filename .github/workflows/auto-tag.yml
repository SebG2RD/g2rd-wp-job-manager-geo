name: Auto-tag

# Détecte les commits dont le sujet commence par `version: x.y.z` (convention
# des dépôts G2RD) et crée le tag git vX.Y.Z correspondant.
#
# IMPORTANT : le tag est poussé avec un PAT (secret GH_PAT) et NON le
# GITHUB_TOKEN par défaut. Un tag poussé par le GITHUB_TOKEN ne re-déclenche
# aucun workflow (garde-fou anti-récursion de GitHub) — release.yml ne
# partirait jamais. Créer un PAT à grain fin limité à ce dépôt (permission
# Contents: Read and write) dans Settings → Secrets and variables → Actions →
# GH_PAT.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tag:
    name: Create tag from version commit
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'version:')

    steps:
      - name: Vérifier la présence du secret GH_PAT
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::Secret GH_PAT absent : impossible de pousser un tag qui déclenche release.yml."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pas de PAT au checkout : il n'est exposé qu'à l'étape finale de push.
          persist-credentials: false

      - name: Extract version from commit subject
        id: extract
        run: |
          subject=$(git log -1 --pretty=%s)
          version=$(echo "$subject" | grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$version" ]; then
            echo "::error::Aucune version x.y.z trouvée dans le sujet du commit : $subject"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify version alignment across all sources
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: bash tools/verify-release-version.sh "$VERSION"

      - name: Verify tag does not exist yet
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Le tag v${VERSION} existe déjà. Bumpe la version avant un commit version:."
            exit 1
          fi

      - name: Create and push tag
        env:
          VERSION: ${{ steps.extract.outputs.version }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}"
