version: 2

updates:
  # Outillage de dev Composer (le plugin n'a aucune dépendance Composer à l'exécution).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Une version n'est proposée qu'après 14 jours de publication (temps de détection
    # d'une version compromise ou retirée), même règle que l'épinglage des actions.
    cooldown:
      default-days: 14
    groups:
      dev-tooling:
        patterns:
          - "phpstan/*"
          - "squizlabs/*"
          - "wp-coding-standards/*"
          - "phpcompatibility/*"
          - "phpcsstandards/*"
          - "pheromone/*"
          - "szepeviktor/*"
          - "dealerdirect/*"

  # jsdom, utilisé uniquement par le harnais de tests JS.
  - package-ecosystem: "npm"
    directory: "/tools/jsdom"
    schedule:
      interval: "weekly"
    # Une version n'est proposée qu'après 14 jours de publication (temps de détection
    # d'une version compromise ou retirée), même règle que l'épinglage des actions.
    cooldown:
      default-days: 14

  # Actions GitHub utilisées par les workflows (épinglées par SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Une version n'est proposée qu'après 14 jours de publication (temps de détection
    # d'une version compromise ou retirée), même règle que l'épinglage des actions.
    cooldown:
      default-days: 14
